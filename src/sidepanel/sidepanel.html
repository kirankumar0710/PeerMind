<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PeerMind</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">PeerMind <span class="tagline">Think together. Refine better.</span></div>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="run" aria-selected="true">Run</button>
      <button role="tab" data-tab="history">History</button>
      <button role="tab" data-tab="settings">Settings</button>
    </nav>
  </header>

  <div id="banners"></div>

  <main>
    <section id="tab-run" class="tab"></section>
    <section id="tab-history" class="tab" hidden></section>
    <section id="tab-settings" class="tab" hidden></section>
  </main>

  <dialog id="dialog"></dialog>
  <script type="module" src="sidepanel.js"></script>
</body>
</html>
