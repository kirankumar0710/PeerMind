<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="610" viewBox="0 0 1400 610">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/></marker></defs>
<rect width="1400" height="610" fill="#fafafa"/>
<text x="40" y="46" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="24" font-weight="800" fill="#111827" text-anchor="start">PeerMind — overview</text>
<text x="40" y="70" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#4b5563" text-anchor="start">A browser extension where one AI model writes an answer and a model from a different vendor reviews it, round after round.</text>
<rect x="40" y="100" width="110" height="150" rx="12" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
<path d="M40 112 a12 12 0 0 1 12 -12 h86 a12 12 0 0 1 12 12 v22 h-110 z" fill="#374151"/>
<text x="95.0" y="123" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="700" fill="#fff" text-anchor="middle">You</text>
<text x="95.0" y="156" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#374151" text-anchor="middle">prompt</text>
<text x="95.0" y="176" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#374151" text-anchor="middle">settings</text>
<line x1="150" y1="175" x2="188" y2="175" stroke="#6b7280" stroke-width="2" marker-end="url(#ah)"/>
<rect x="190" y="100" width="240" height="150" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<path d="M190 112 a12 12 0 0 1 12 -12 h216 a12 12 0 0 1 12 12 v22 h-240 z" fill="#2563eb"/>
<text x="310.0" y="123" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="700" fill="#fff" text-anchor="middle">UI — side panel</text>
<text x="310.0" y="156" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#374151" text-anchor="middle">Run — prompt, answer,</text>
<text x="310.0" y="176" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#374151" text-anchor="middle">findings, cost metrics</text>
<text x="310.0" y="196" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#374151" text-anchor="middle">History — past runs</text>
<text x="310.0" y="216" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#374151" text-anchor="middle">Settings — keys, models</text>
<line x1="430" y1="175" x2="478" y2="175" stroke="#6b7280" stroke-width="2" marker-end="url(#ah)" marker-start="url(#ah)"/>
<rect x="480" y="100" width="230" height="150" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
<path d="M480 112 a12 12 0 0 1 12 -12 h206 a12 12 0 0 1 12 12 v22 h-230 z" fill="#7c3aed"/>
<text x="595.0" y="123" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="700" fill="#fff" text-anchor="middle">Background</text>
<text x="595.0" y="156" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#374151" text-anchor="middle">Orchestrator runs</text>
<text x="595.0" y="176" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#374151" text-anchor="middle">the review loop</text>
<text x="595.0" y="196" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#374151" text-anchor="middle">budget checks</text>
<text x="595.0" y="216" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#374151" text-anchor="middle">saves every step</text>
<line x1="710" y1="175" x2="748" y2="175" stroke="#6b7280" stroke-width="2" marker-end="url(#ah)"/>
<rect x="750" y="100" width="220" height="150" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<path d="M750 112 a12 12 0 0 1 12 -12 h196 a12 12 0 0 1 12 12 v22 h-220 z" fill="#d97706"/>
<text x="860.0" y="123" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="700" fill="#fff" text-anchor="middle">Tools &amp; routing</text>
<text x="860.0" y="156" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#374151" text-anchor="middle">Web search</text>
<text x="860.0" y="176" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#374151" text-anchor="middle">Image generation</text>
<text x="860.0" y="196" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#374151" text-anchor="middle">picks the right tool</text>
<text x="860.0" y="216" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#374151" text-anchor="middle">version per model</text>
<line x1="970" y1="175" x2="1008" y2="175" stroke="#6b7280" stroke-width="2" marker-end="url(#ah)"/>
<rect x="1010" y="100" width="200" height="150" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
<path d="M1010 112 a12 12 0 0 1 12 -12 h176 a12 12 0 0 1 12 12 v22 h-200 z" fill="#059669"/>
<text x="1110.0" y="123" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="700" fill="#fff" text-anchor="middle">Adapters</text>
<text x="1110.0" y="156" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#374151" text-anchor="middle">OpenAI</text>
<text x="1110.0" y="176" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#374151" text-anchor="middle">Anthropic</text>
<text x="1110.0" y="196" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#374151" text-anchor="middle">Google Gemini</text>
<text x="1110.0" y="216" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#374151" text-anchor="middle">streaming · timeouts</text>
<line x1="1210" y1="175" x2="1238" y2="175" stroke="#6b7280" stroke-width="2" marker-end="url(#ah)"/>
<rect x="1240" y="100" width="120" height="150" rx="12" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2" stroke-dasharray="5 4"/>
<text x="1300.0" y="123" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="700" fill="#9ca3af" text-anchor="middle">Vendor APIs</text>
<text x="1300.0" y="156" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#374151" text-anchor="middle">HTTPS +</text>
<text x="1300.0" y="176" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#374151" text-anchor="middle">your API</text>
<text x="1300.0" y="196" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#374151" text-anchor="middle">keys</text>
<line x1="595" y1="250" x2="595" y2="298" stroke="#6b7280" stroke-width="2" marker-end="url(#ah)" stroke-dasharray="4 3"/>
<text x="605" y="280" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="12" font-weight="500" fill="#4b5563" text-anchor="start" font-style="italic">runs</text>
<rect x="40" y="300" width="1320" height="170" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="60" y="328" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#7c3aed" text-anchor="start">How a run works</text>
<rect x="75" y="346" width="214" height="66" rx="10" fill="#fff" stroke="#2563eb" stroke-width="1.8"/>
<text x="182.0" y="373" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#2563eb" text-anchor="middle">Generator</text>
<text x="182.0" y="394" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#374151" text-anchor="middle">drafts the answer</text>
<line x1="293" y1="379" x2="333" y2="379" stroke="#6b7280" stroke-width="2" marker-end="url(#ah)"/>
<rect x="337" y="346" width="214" height="66" rx="10" fill="#fff" stroke="#db2777" stroke-width="1.8"/>
<text x="444.0" y="373" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#db2777" text-anchor="middle">Reviewer (other vendor)</text>
<text x="444.0" y="394" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#374151" text-anchor="middle">critiques it as findings</text>
<line x1="555" y1="379" x2="595" y2="379" stroke="#6b7280" stroke-width="2" marker-end="url(#ah)"/>
<rect x="599" y="346" width="214" height="66" rx="10" fill="#fff" stroke="#2563eb" stroke-width="1.8"/>
<text x="706.0" y="373" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#2563eb" text-anchor="middle">Generator</text>
<text x="706.0" y="394" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#374151" text-anchor="middle">answers each finding, revises</text>
<line x1="817" y1="379" x2="857" y2="379" stroke="#6b7280" stroke-width="2" marker-end="url(#ah)"/>
<rect x="861" y="346" width="214" height="66" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="1.8"/>
<text x="968.0" y="373" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#7c3aed" text-anchor="middle">PeerMind decides</text>
<text x="968.0" y="394" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#374151" text-anchor="middle">done, or another round?</text>
<line x1="1079" y1="379" x2="1119" y2="379" stroke="#6b7280" stroke-width="2" marker-end="url(#ah)"/>
<rect x="1123" y="346" width="214" height="66" rx="10" fill="#fff" stroke="#059669" stroke-width="1.8"/>
<text x="1230.0" y="373" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#059669" text-anchor="middle">Final answer</text>
<text x="1230.0" y="394" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#374151" text-anchor="middle">+ sources, images, costs</text>
<path d="M968.0 414 v24 H444.0 v-22" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#ah)"/>
<text x="706.0" y="456" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="12" font-weight="500" fill="#4b5563" text-anchor="middle" font-style="italic">another round (until no open findings, the iteration limit, or the budget cap)</text>
<rect x="40" y="500" width="420" height="90" rx="12" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
<path d="M40 512 a12 12 0 0 1 12 -12 h396 a12 12 0 0 1 12 12 v22 h-420 z" fill="#0891b2"/>
<text x="250.0" y="523" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="700" fill="#fff" text-anchor="middle">Storage</text>
<text x="250.0" y="556" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#374151" text-anchor="middle">Conversations, findings and images in IndexedDB</text>
<text x="250.0" y="576" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#374151" text-anchor="middle">API keys kept only for the browser session</text>
<rect x="490" y="500" width="420" height="90" rx="12" fill="#fdf2f8" stroke="#db2777" stroke-width="2"/>
<path d="M490 512 a12 12 0 0 1 12 -12 h396 a12 12 0 0 1 12 12 v22 h-420 z" fill="#db2777"/>
<text x="700.0" y="523" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="700" fill="#fff" text-anchor="middle">Export</text>
<text x="700.0" y="556" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#374151" text-anchor="middle">Any conversation → one .zip archive</text>
<text x="700.0" y="576" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#374151" text-anchor="middle">(answers, findings, images)</text>
<rect x="940" y="500" width="420" height="90" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<path d="M940 512 a12 12 0 0 1 12 -12 h396 a12 12 0 0 1 12 12 v22 h-420 z" fill="#dc2626"/>
<text x="1150.0" y="523" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="700" fill="#fff" text-anchor="middle">Package</text>
<text x="1150.0" y="556" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#374151" text-anchor="middle">create_package.sh → dist/peermind-&lt;version&gt;.zip</text>
<text x="1150.0" y="576" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#374151" text-anchor="middle">tested, then loaded in Brave or Chrome</text>
</svg>